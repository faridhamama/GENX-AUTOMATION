@if (aboutLoading()) {
  <div class="p-8 flex items-center justify-center">
    <app-loader size="lg"></app-loader>
  </div>
} @else {
  <div class="p-6 space-y-6 max-w-5xl mx-auto">

    <!-- Hero Section -->
    <app-section-card icon="person" title="Hero" description="Introduction principale de la section A propos">
      <form (submit)="saveAboutHero()" class="space-y-4">
        <app-form-field label="Label" helper="Texte d'accent au-dessus du titre principal">
          <input [formField]="aboutHeroForm.label" class="w-full bg-surface-container-low border border-outline-variant focus:border-primary outline-none px-3 py-2.5 text-sm transition-colors rounded-sm" />
        </app-form-field>
        <app-form-field label="Headline" helper="Titre principal de la section Hero">
          <input [formField]="aboutHeroForm.headline" class="w-full bg-surface-container-low border border-outline-variant focus:border-primary outline-none px-3 py-2.5 text-sm transition-colors rounded-sm" />
        </app-form-field>
        <app-form-field label="Body" helper="Paragraphe de description sous le titre">
          <textarea [formField]="aboutHeroForm.body" rows="3" class="w-full bg-surface-container-low border border-outline-variant focus:border-primary outline-none px-3 py-2.5 text-sm transition-colors rounded-sm resize-y"></textarea>
        </app-form-field>
        <button type="submit" [disabled]="savingHero()" class="flex items-center gap-1.5 bg-primary text-on-primary px-5 py-2.5 font-label font-bold uppercase tracking-widest text-[10px] hover:bg-on-primary-fixed-variant transition-colors rounded-sm cursor-pointer disabled:opacity-50">
          @if (savingHero()) {
            <span class="material-symbols-outlined text-base animate-spin" aria-hidden="true">progress_activity</span>
          } @else {
            <span class="material-symbols-outlined text-base" aria-hidden="true">check</span>
          }
          Enregistrer
        </button>
      </form>
    </app-section-card>

    <!-- Availability Section -->
    <app-section-card icon="schedule" title="Disponibilite" description="Horaires et jours de disponibilite pour les rendez-vous">
      <form (submit)="saveAboutAvailability()" class="space-y-4">
        <app-form-field label="Label" helper="Titre de la section disponibilite">
          <input [formField]="aboutAvailForm.label" class="w-full bg-surface-container-low border border-outline-variant focus:border-primary outline-none px-3 py-2.5 text-sm transition-colors rounded-sm" />
        </app-form-field>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <app-form-field label="Jours" helper="Jours de la semaine disponibles">
            <input [formField]="aboutAvailForm.days" class="w-full bg-surface-container-low border border-outline-variant focus:border-primary outline-none px-3 py-2.5 text-sm transition-colors rounded-sm" />
          </app-form-field>
          <app-form-field label="Heures" helper="Plage horaire quotidienne">
            <input [formField]="aboutAvailForm.hours" class="w-full bg-surface-container-low border border-outline-variant focus:border-primary outline-none px-3 py-2.5 text-sm transition-colors rounded-sm" />
          </app-form-field>
        </div>
        <button type="submit" [disabled]="savingAvailability()" class="flex items-center gap-1.5 bg-primary text-on-primary px-5 py-2.5 font-label font-bold uppercase tracking-widest text-[10px] hover:bg-on-primary-fixed-variant transition-colors rounded-sm cursor-pointer disabled:opacity-50">
          @if (savingAvailability()) {
            <span class="material-symbols-outlined text-base animate-spin" aria-hidden="true">progress_activity</span>
          } @else {
            <span class="material-symbols-outlined text-base" aria-hidden="true">check</span>
          }
          Enregistrer
        </button>
      </form>
    </app-section-card>

    <!-- Mission Section -->
    <app-section-card icon="format_quote" title="Mission" description="Citation ou declaration de mission de l'entreprise">
      <form (submit)="saveAboutMission()" class="space-y-4">
        <app-form-field label="Label" helper="Titre de la section mission">
          <input [formField]="aboutMissionForm.label" class="w-full bg-surface-container-low border border-outline-variant focus:border-primary outline-none px-3 py-2.5 text-sm transition-colors rounded-sm" />
        </app-form-field>
        <app-form-field label="Quote" helper="Citation ou declaration inspirante">
          <textarea [formField]="aboutMissionForm.quote" rows="3" class="w-full bg-surface-container-low border border-outline-variant focus:border-primary outline-none px-3 py-2.5 text-sm transition-colors rounded-sm resize-y"></textarea>
        </app-form-field>
        <button type="submit" [disabled]="savingMission()" class="flex items-center gap-1.5 bg-primary text-on-primary px-5 py-2.5 font-label font-bold uppercase tracking-widest text-[10px] hover:bg-on-primary-fixed-variant transition-colors rounded-sm cursor-pointer disabled:opacity-50">
          @if (savingMission()) {
            <span class="material-symbols-outlined text-base animate-spin" aria-hidden="true">progress_activity</span>
          } @else {
            <span class="material-symbols-outlined text-base" aria-hidden="true">check</span>
          }
          Enregistrer
        </button>
      </form>
    </app-section-card>

    <!-- Company Description Section -->
    <app-section-card icon="domain" title="Description Entreprise" description="Presentation de l'entreprise et de son activite">
      <form (submit)="saveAboutCompany()" class="space-y-4">
        <app-form-field label="Label" helper="Titre de la section description">
          <input [formField]="aboutCompanyForm.label" class="w-full bg-surface-container-low border border-outline-variant focus:border-primary outline-none px-3 py-2.5 text-sm transition-colors rounded-sm" />
        </app-form-field>
        <app-form-field label="Body" helper="Description detaillee de l'entreprise">
          <textarea [formField]="aboutCompanyForm.body" rows="4" class="w-full bg-surface-container-low border border-outline-variant focus:border-primary outline-none px-3 py-2.5 text-sm transition-colors rounded-sm resize-y"></textarea>
        </app-form-field>
        <button type="submit" [disabled]="savingCompany()" class="flex items-center gap-1.5 bg-primary text-on-primary px-5 py-2.5 font-label font-bold uppercase tracking-widest text-[10px] hover:bg-on-primary-fixed-variant transition-colors rounded-sm cursor-pointer disabled:opacity-50">
          @if (savingCompany()) {
            <span class="material-symbols-outlined text-base animate-spin" aria-hidden="true">progress_activity</span>
          } @else {
            <span class="material-symbols-outlined text-base" aria-hidden="true">check</span>
          }
          Enregistrer
        </button>
      </form>
    </app-section-card>

    <!-- Services Section -->
    <app-section-card icon="handyman" title="Section Services" description="En-tete et texte d'introduction pour la section services">
      <form (submit)="saveAboutServicesSection()" class="space-y-4">
        <app-form-field label="Headline" helper="Titre de la section services">
          <input [formField]="aboutServicesSectionForm.headline" class="w-full bg-surface-container-low border border-outline-variant focus:border-primary outline-none px-3 py-2.5 text-sm transition-colors rounded-sm" />
        </app-form-field>
        <app-form-field label="Subtext" helper="Texte descriptif sous le titre">
          <textarea [formField]="aboutServicesSectionForm.subtext" rows="3" class="w-full bg-surface-container-low border border-outline-variant focus:border-primary outline-none px-3 py-2.5 text-sm transition-colors rounded-sm resize-y"></textarea>
        </app-form-field>
        <button type="submit" [disabled]="savingServicesSection()" class="flex items-center gap-1.5 bg-primary text-on-primary px-5 py-2.5 font-label font-bold uppercase tracking-widest text-[10px] hover:bg-on-primary-fixed-variant transition-colors rounded-sm cursor-pointer disabled:opacity-50">
          @if (savingServicesSection()) {
            <span class="material-symbols-outlined text-base animate-spin" aria-hidden="true">progress_activity</span>
          } @else {
            <span class="material-symbols-outlined text-base" aria-hidden="true">check</span>
          }
          Enregistrer
        </button>
      </form>
    </app-section-card>

    <!-- Values Section -->
    <app-section-card icon="emoji_events" title="Section Valeurs" description="En-tete et texte d'introduction pour la section valeurs">
      <form (submit)="saveAboutValuesSection()" class="space-y-4">
        <app-form-field label="Headline" helper="Titre de la section valeurs">
          <input [formField]="aboutValuesSectionForm.headline" class="w-full bg-surface-container-low border border-outline-variant focus:border-primary outline-none px-3 py-2.5 text-sm transition-colors rounded-sm" />
        </app-form-field>
        <app-form-field label="Subtext" helper="Texte descriptif sous le titre">
          <textarea [formField]="aboutValuesSectionForm.subtext" rows="3" class="w-full bg-surface-container-low border border-outline-variant focus:border-primary outline-none px-3 py-2.5 text-sm transition-colors rounded-sm resize-y"></textarea>
        </app-form-field>
        <button type="submit" [disabled]="savingValuesSection()" class="flex items-center gap-1.5 bg-primary text-on-primary px-5 py-2.5 font-label font-bold uppercase tracking-widest text-[10px] hover:bg-on-primary-fixed-variant transition-colors rounded-sm cursor-pointer disabled:opacity-50">
          @if (savingValuesSection()) {
            <span class="material-symbols-outlined text-base animate-spin" aria-hidden="true">progress_activity</span>
          } @else {
            <span class="material-symbols-outlined text-base" aria-hidden="true">check</span>
          }
          Enregistrer
        </button>
      </form>
    </app-section-card>

    <!-- CTA Section -->
    <app-section-card icon="campaign" title="Section CTA" description="Appels a l'action et liens vers les pages de contact">
      <form (submit)="saveAboutCtaSection()" class="space-y-4">
        <app-form-field label="Headline" helper="Titre de la section CTA">
          <input [formField]="aboutCtaSectionForm.headline" class="w-full bg-surface-container-low border border-outline-variant focus:border-primary outline-none px-3 py-2.5 text-sm transition-colors rounded-sm" />
        </app-form-field>
        <app-form-field label="Subtext" helper="Texte descriptif sous le titre">
          <textarea [formField]="aboutCtaSectionForm.subtext" rows="2" class="w-full bg-surface-container-low border border-outline-variant focus:border-primary outline-none px-3 py-2.5 text-sm transition-colors rounded-sm resize-y"></textarea>
        </app-form-field>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <app-form-field label="CTA Primary Label" helper="Texte du bouton principal">
            <input [formField]="aboutCtaSectionForm.cta_primary_label" class="w-full bg-surface-container-low border border-outline-variant focus:border-primary outline-none px-3 py-2.5 text-sm transition-colors rounded-sm" />
          </app-form-field>
          <app-form-field label="CTA Primary Link" helper="URL du bouton principal">
            <input [formField]="aboutCtaSectionForm.cta_primary_link" class="w-full bg-surface-container-low border border-outline-variant focus:border-primary outline-none px-3 py-2.5 text-sm transition-colors rounded-sm" />
          </app-form-field>
          <app-form-field label="CTA Secondary Label" helper="Texte du bouton secondaire">
            <input [formField]="aboutCtaSectionForm.cta_secondary_label" class="w-full bg-surface-container-low border border-outline-variant focus:border-primary outline-none px-3 py-2.5 text-sm transition-colors rounded-sm" />
          </app-form-field>
          <app-form-field label="CTA Secondary Link" helper="URL du bouton secondaire">
            <input [formField]="aboutCtaSectionForm.cta_secondary_link" class="w-full bg-surface-container-low border border-outline-variant focus:border-primary outline-none px-3 py-2.5 text-sm transition-colors rounded-sm" />
          </app-form-field>
        </div>
        <button type="submit" [disabled]="savingCtaSection()" class="flex items-center gap-1.5 bg-primary text-on-primary px-5 py-2.5 font-label font-bold uppercase tracking-widest text-[10px] hover:bg-on-primary-fixed-variant transition-colors rounded-sm cursor-pointer disabled:opacity-50">
          @if (savingCtaSection()) {
            <span class="material-symbols-outlined text-base animate-spin" aria-hidden="true">progress_activity</span>
          } @else {
            <span class="material-symbols-outlined text-base" aria-hidden="true">check</span>
          }
          Enregistrer
        </button>
      </form>
    </app-section-card>

    <!-- Images Section -->
    <app-section-card icon="image" title="Images" description="Modifier les images utilisees dans la section A propos">
      @if (editingAboutImageKey()) {
        <div class="bg-surface-container-low border border-outline-variant rounded-sm p-4 mb-4">
          <h3 class="font-label text-[10px] font-bold uppercase tracking-widest text-outline mb-3">Modifier l'image: {{ aboutImageForm().key }}</h3>
          <div class="space-y-4">
            <app-form-field label="Fichier image" helper="Choisissez un fichier image (PNG, JPG, WebP, SVG)">
              <input (change)="onImageFileSelected($event, aboutImageForm().key)" type="file" accept="image/*" class="w-full text-sm text-on-surface file:mr-3 file:py-2 file:px-4 file:rounded file:border-0 file:bg-primary file:text-on-primary file:font-bold file:font-label file:uppercase file:tracking-widest file:text-[10px]" />
            </app-form-field>
            <app-form-field label="Alt Text" helper="Texte alternatif pour l'accessibilite">
              <input [ngModel]="aboutImageForm().alt_text" (ngModelChange)="aboutImageForm.update(f => ({ ...f, alt_text: $event }))" name="aboutImageAlt" class="w-full bg-surface border border-outline-variant focus:border-primary outline-none px-3 py-2.5 text-sm transition-colors rounded-sm" />
            </app-form-field>
          </div>
          <div class="flex gap-2 mt-4">
            <button type="button" (click)="uploadAboutImage()" [disabled]="uploadingImage()" class="flex items-center gap-1.5 bg-primary text-on-primary px-5 py-2.5 font-label font-bold uppercase tracking-widest text-[10px] hover:bg-on-primary-fixed-variant transition-colors rounded-sm cursor-pointer disabled:opacity-50">
              @if (uploadingImage()) {
                <span class="material-symbols-outlined text-base animate-spin" aria-hidden="true">progress_activity</span>
              } @else {
                <span class="material-symbols-outlined text-base" aria-hidden="true">check</span>
              }
              Enregistrer
            </button>
            <button type="button" (click)="cancelEditAboutImage()" class="bg-surface-container-high text-on-surface px-5 py-2.5 font-label font-bold uppercase tracking-widest text-[10px] hover:bg-surface-container-lowest transition-colors rounded-sm cursor-pointer">
              Annuler
            </button>
          </div>
        </div>
      }

      <div class="space-y-3">
        @for (img of aboutImages(); track img.image_key) {
          <div class="flex items-center gap-4 bg-surface-container-low border border-outline-variant rounded-sm p-3">
            @if (img.url) {
              <img [src]="img.url" [alt]="img.alt_text" class="w-16 h-16 object-cover rounded-sm shrink-0" />
            } @else {
              <div class="w-16 h-16 bg-outline-variant/20 rounded-sm flex items-center justify-center shrink-0">
                <span class="material-symbols-outlined text-outline text-xl" aria-hidden="true">image_not_supported</span>
              </div>
            }
            <div class="flex-1 min-w-0">
              <div class="font-label text-[10px] font-bold uppercase tracking-widest text-outline mb-0.5">{{ img.image_key }}</div>
              <div class="text-xs text-on-surface-variant truncate">{{ img.alt_text || 'Pas de texte alternatif' }}</div>
            </div>
            <button type="button" (click)="startEditAboutImage(img.image_key)" class="shrink-0 bg-primary/10 text-primary px-3 py-2 font-label font-bold uppercase tracking-widest text-[10px] hover:bg-primary/20 transition-colors rounded-sm cursor-pointer">
              Modifier
            </button>
          </div>
        } @empty {
          <app-empty-state icon="image" message="Aucune image trouvee"></app-empty-state>
        }
      </div>
    </app-section-card>

  </div>
}
