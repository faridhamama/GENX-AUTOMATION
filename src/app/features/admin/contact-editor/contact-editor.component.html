<div class="p-6 max-w-5xl mx-auto space-y-8">
  <h1 class="text-2xl font-medium text-on-surface">Contenu Contact</h1>

  @if (contact.contactLoading()) {
    <div class="flex items-center justify-center py-12">
      <app-loader size="lg"></app-loader>
    </div>
  } @else {

    <!-- Hero Section -->
    <app-section-card icon="manage_accounts" title="En-tête" description="Configurez le titre principal et la description de la page contact">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <app-form-field label="Label" helper="Texte d'accroche court (ex: Contactez-nous)">
          <input type="text" [formField]="contactHeroForm.label" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Titre" helper="Titre principal de la page">
          <input type="text" [formField]="contactHeroForm.headline" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Corps" helper="Description sous le titre">
          <input type="text" [formField]="contactHeroForm.body" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
      </div>
      <button (click)="saveContactHero()" [disabled]="savingContactHero()" class="flex items-center gap-1.5 bg-primary text-on-primary px-5 py-2.5 rounded hover:bg-primary-container transition-colors cursor-pointer disabled:opacity-50">
        @if (savingContactHero()) {
          <span class="material-symbols-outlined text-base animate-spin" aria-hidden="true">progress_activity</span>
        } @else {
          <span class="material-symbols-outlined text-base" aria-hidden="true">check</span>
        }
        Enregistrer
      </button>
    </app-section-card>

    <!-- Stats Section -->
    <app-section-card icon="bar_chart" title="Statistiques" description="Définissez les valeurs et libellés de vos indicateurs clés">
      <div class="space-y-3">
        @for (stat of contact.contactStats(); track stat.id) {
          <div class="flex gap-3 items-center">
            <div class="flex-1">
              <app-form-field label="Valeur" helper="Nombre ou pourcentage affiché">
                <input type="text" [value]="stat.value" (input)="stat.value = $any($event.target).value" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
              </app-form-field>
            </div>
            <div class="flex-1">
              <app-form-field label="Libellé" helper="Description de la statistique">
                <input type="text" [value]="stat.label" (input)="stat.label = $any($event.target).value" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
              </app-form-field>
            </div>
            <button (click)="saveContactStat(stat)" [disabled]="savingContactStat()" class="flex items-center gap-1.5 px-3 py-2 bg-surface-container-high rounded hover:bg-surface-container-hover transition-colors text-sm cursor-pointer disabled:opacity-50">
              @if (savingContactStat()) {
                <span class="material-symbols-outlined text-base animate-spin" aria-hidden="true">progress_activity</span>
              } @else {
                <span class="material-symbols-outlined text-base" aria-hidden="true">check</span>
              }
              Enregistrer
            </button>
          </div>
        }
      </div>
    </app-section-card>

    <!-- Project Types Section -->
    <app-section-card icon="category" title="Types de projet" description="Ajoutez ou modifiez les catégories de projets proposées">
      <div class="space-y-3">
        @for (pt of contact.projectTypes(); track pt.id) {
          <div class="flex gap-3 items-center">
            <div class="flex-1">
              <app-form-field label="Libellé" helper="Nom du type de projet">
                <input type="text" [value]="pt.label" (input)="pt.label = $any($event.target).value" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
              </app-form-field>
            </div>
            <button (click)="saveProjectType(pt)" [disabled]="savingProjectType()" class="flex items-center gap-1.5 px-3 py-2 bg-surface-container-high rounded hover:bg-surface-container-hover transition-colors text-sm cursor-pointer disabled:opacity-50">
              @if (savingProjectType()) {
                <span class="material-symbols-outlined text-base animate-spin" aria-hidden="true">progress_activity</span>
              } @else {
                <span class="material-symbols-outlined text-base" aria-hidden="true">check</span>
              }
              Enregistrer
            </button>
          </div>
        }
      </div>
    </app-section-card>

    <!-- Form Content Section -->
    <app-section-card icon="description" title="Contenu du formulaire" description="Personnalisez les textes affichés dans le formulaire de contact">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <app-form-field label="Titre du formulaire" helper="En-tête du formulaire de contact">
          <input type="text" [formField]="contactFormContentForm.form_title" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Texte de succès" helper="Titre affiché après envoi réussi">
          <input type="text" [formField]="contactFormContentForm.success_title" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Corps de succès" helper="Message détaillé après envoi réussi">
          <input type="text" [formField]="contactFormContentForm.success_body" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Message d'erreur" helper="Texte affiché en cas d'erreur d'envoi">
          <input type="text" [formField]="contactFormContentForm.error_message" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Note de pied" helper="Texte informatif sous le formulaire">
          <input type="text" [formField]="contactFormContentForm.footer_note" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Label submit" helper="Texte du bouton d'envoi">
          <input type="text" [formField]="contactFormContentForm.submit_label" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Label chargement" helper="Texte affiché pendant l'envoi">
          <input type="text" [formField]="contactFormContentForm.loading_label" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
      </div>
      <button (click)="saveContactFormContent()" [disabled]="savingContactFormContent()" class="flex items-center gap-1.5 bg-primary text-on-primary px-5 py-2.5 rounded hover:bg-primary-container transition-colors cursor-pointer disabled:opacity-50">
        @if (savingContactFormContent()) {
          <span class="material-symbols-outlined text-base animate-spin" aria-hidden="true">progress_activity</span>
        } @else {
          <span class="material-symbols-outlined text-base" aria-hidden="true">check</span>
        }
        Enregistrer
      </button>
    </app-section-card>

    <!-- Form Labels Section -->
    <app-section-card icon="label" title="Libellés du formulaire" description="Personnalisez les étiquettes, placeholders et messages d'erreur de chaque champ">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <app-form-field label="Nom complet - Label" helper="Étiquette du champ nom">
          <input type="text" [formField]="formLabelsForm.full_name_label" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Nom complet - Placeholder" helper="Texte d'exemple dans le champ">
          <input type="text" [formField]="formLabelsForm.full_name_placeholder" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Nom complet - Erreur" helper="Message si validation échoue">
          <input type="text" [formField]="formLabelsForm.full_name_error" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Téléphone - Label" helper="Étiquette du champ téléphone">
          <input type="text" [formField]="formLabelsForm.phone_label" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Téléphone - Placeholder" helper="Texte d'exemple dans le champ">
          <input type="text" [formField]="formLabelsForm.phone_placeholder" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Téléphone - Erreur" helper="Message si validation échoue">
          <input type="text" [formField]="formLabelsForm.phone_error" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Email - Label" helper="Étiquette du champ email">
          <input type="text" [formField]="formLabelsForm.email_label" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Email - Placeholder" helper="Texte d'exemple dans le champ">
          <input type="text" [formField]="formLabelsForm.email_placeholder" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Email - Erreur" helper="Message si validation échoue">
          <input type="text" [formField]="formLabelsForm.email_error" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Date souhaitée - Label" helper="Étiquette du champ date">
          <input type="text" [formField]="formLabelsForm.desired_date_label" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Date souhaitée - Placeholder" helper="Texte d'exemple dans le champ">
          <input type="text" [formField]="formLabelsForm.desired_date_placeholder" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Type de projet - Label" helper="Étiquette du champ projet">
          <input type="text" [formField]="formLabelsForm.project_type_label" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Description - Label" helper="Étiquette du champ description">
          <input type="text" [formField]="formLabelsForm.description_label" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Description - Placeholder" helper="Texte d'exemple dans le champ">
          <input type="text" [formField]="formLabelsForm.description_placeholder" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
        <app-form-field label="Description - Erreur" helper="Message si validation échoue">
          <input type="text" [formField]="formLabelsForm.description_error" class="w-full px-3 py-2 bg-surface-container-high rounded text-on-surface" />
        </app-form-field>
      </div>
      <button (click)="saveFormLabels()" [disabled]="savingFormLabels()" class="flex items-center gap-1.5 bg-primary text-on-primary px-5 py-2.5 rounded hover:bg-primary-container transition-colors cursor-pointer disabled:opacity-50">
        @if (savingFormLabels()) {
          <span class="material-symbols-outlined text-base animate-spin" aria-hidden="true">progress_activity</span>
        } @else {
          <span class="material-symbols-outlined text-base" aria-hidden="true">check</span>
        }
        Enregistrer
      </button>
    </app-section-card>

  }
</div>
